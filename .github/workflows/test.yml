name: tests

on:
  push:
  pull_request:

jobs:
  godot-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Download Godot 4.3
        run: |
          wget -q --tries=5 --waitretry=10 --retry-connrefused --retry-on-http-error=500,502,503,504 https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q Godot_v4.3-stable_linux.x86_64.zip
          mv Godot_v4.3-stable_linux.x86_64 godot
          chmod +x godot
      - name: Import project
        run: ./godot --headless --path . --import || true
      - name: Run tests
        run: |
          ./godot --headless --path . --fixed-fps 60 -s res://tests/run_tests.gd 2>&1 | tee test.log
          grep -q "RESULT: .* passed, 0 failed" test.log
